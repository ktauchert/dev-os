<!doctype html>
<html lang="en" class="dark" data-accent="stone">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DevOS</title>
    <link rel="icon" href="data:," />
    <script>
      ;(function () {
        try {
          var m = localStorage.getItem('devos-theme-mode') || 'dark'
          var a = localStorage.getItem('devos-theme-accent') || 'stone'
          var r = document.documentElement
          if (m === 'dark') r.classList.add('dark')
          else r.classList.remove('dark')
          r.dataset.accent = a
        } catch (e) {
          document.documentElement.classList.add('dark')
          document.documentElement.dataset.accent = 'stone'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
